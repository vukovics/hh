services:
  postgres:
    image: postgres:16
    container_name: happyhotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: happyhotel
      POSTGRES_PASSWORD: happyhotel
      POSTGRES_DB: happyhotel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: